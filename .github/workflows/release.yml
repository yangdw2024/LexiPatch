name: Release LexiPatch

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build patcher-stub
        run: |
          cargo build --release -p transcore-patcher
          Copy-Item target\release\transcore-patcher.exe src-tauri\resources\patcher-stub.exe -Force

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "译铸 LexiPatch v__VERSION__"
          releaseBody: "Rust + Tauri 2 + SQLite 桌面端安装包与独立 .exe 补丁引导器。"
          releaseDraft: false
          prerelease: false

  publish-pypi:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Python package
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir python/dist python/
      - name: Publish to PyPI
        if: env.PYPI_TOKEN != ''
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload python/dist/* -u __token__ -p "$PYPI_TOKEN" --skip-existing
