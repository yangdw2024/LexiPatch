[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexipatch"
version = "2.0.1"
description = "LexiPatch (译铸) — Software localization resource scanner, placeholder QA validator, and format-preserving patcher."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LexiPatch Team", email = "yangdw2021@gmail.com" }]
keywords = ["localization", "i18n", "l10n", "translation", "patcher", "cli"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Localization",
]

[project.scripts]
lexipatch = "lexipatch.cli:main"

[project.urls]
Homepage = "https://github.com/yangdw2024/LexiPatch"
Repository = "https://github.com/yangdw2024/LexiPatch"
